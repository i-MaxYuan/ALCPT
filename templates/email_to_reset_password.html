<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'head.html' %}
  {% block stylesheets %}{% endblock %}
  {% block scripts %}{% endblock %}
</head>

{% include 'header.html' %}

<body>
  <main class="login-page">
    <div class="login-container">
      <h2 class="login-title">{{ trans("Password Reset") }}</h2>

      <form action="{{ url('password_forget') }}" method="post" class="login-form">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />

        <!-- 帳號 -->
        <div class="input-group">
          <label for="reg_id" class="input-label">
            <i class="bi bi-person-fill"></i> {{ trans("Account ID") }}
          </label>
          <input
            type="text"
            id="reg_id"
            name="reg_id"
            class="input-field"
            placeholder="{{ trans('Please enter your account ID') }}"
            required
          />
        </div>

        <!-- 電子郵件 -->
        <div class="input-group">
          <label for="email" class="input-label">
            <i class="bi bi-envelope-fill"></i> {{ trans("Email") }}
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="input-field"
            placeholder="{{ trans('Please enter your registered email') }}"
            required
          />
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" class="btn-login">{{ trans("Submit") }}</button>

        <!-- 返回登入 -->
        <div class="link-row">
          <a href="{{ url('login') }}">{{ trans("Back to Login") }}</a>
        </div>
      </form>
    </div>
  </main>

  <style>
    /* 背景與整體排版 */
    .login-page {
      background: #f7f8fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #bde3f0;
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 450px;
      text-align: center;
    }

    .login-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #1e3a8a;
    }

    /* 輸入框組 */
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 18px;
      color: #1e3a8a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-field {
      width: 100%;
      height: 45px;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 4px rgba(37, 99, 235, 0.4);
    }

    /* 提交按鈕 */
    .btn-login {
      width: 100%;
      background-color: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 12px;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #1e40af;
    }

    /* 底部連結 */
    .link-row {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }

    .link-row a {
      color: #1e3a8a;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
    }

    .link-row a:hover {
      color: #2563eb;
    }
  </style>

  {% include "footer.html" %}
</body>
</html>
