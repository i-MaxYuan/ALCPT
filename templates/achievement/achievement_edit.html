<title>ALCPT - Achievement Edit</title>

{% extends 'new_base.html'%}

{% block scripts %}
<script src="{{ static('/javascript/question/create.js') }}"></script>
<script>
    // 顯示檔案名稱
    $(".custom-file-input").on("change", function() {
        var fileName = $(this).val().split("\\").pop();
        $(this).siblings(".custom-file-label").addClass("selected").html(fileName);
    });
</script>
{% endblock %}

{% block path %}
<li class="breadcrumb-item active" aria-current="page">
    {{trans("Achievement Edit")}}
</li>
{% endblock %}

{% block content %}
<main class="achievement-create-form">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="achievement-card">
                    <div class="card-header">
                        {{trans("Edit Achievement")}}
                    </div>

                    <form enctype="multipart/form-data" method="post">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />

                        <!-- Trophy -->
                        <label class="form-label">{{trans("Trophy")}}</label>
                        <div class="input-group mb-3">
                            <div class="custom-file">
                                <input type="file" class="custom-file-input" id="trophy" name="trophy" onchange="OpenButton('listening')" />
                                <label class="custom-file-label" for="badge">{{trans("Select Trophy photo")}}</label>
                            </div>
                        </div>

                        <!-- Name -->
                        <label class="form-label">{{trans("Name")}}</label>
                        <input class="form-control mb-3" type="text" name="name" id="name" onkeyup="OpenButton('{{ kind }}')" placeholder="{{trans("Achievement name")}}..." required />

                        <!-- Key -->
                        <label class="form-label">{{trans("Key")}}</label>
                        <input class="form-control mb-3" type="text" name="key" id="key" onkeyup="OpenButton('{{ kind }}')" placeholder="{{trans("提示")}}..." required />

                        <!-- Description -->
                        <label class="form-label">{{trans("Description")}}</label>
                        <textarea class="form-control mb-3" cols="100" rows="5" name="description" id="description" onkeyup="OpenButton('reading')" placeholder="{{trans("描述")}}..." required></textarea>

                        <!-- Category -->
                        <label class="form-label">{{trans("Category")}}</label>
                        <select class="custom-select mb-3" id="category" name="category" required>
                            <option value="" disabled selected>{{trans("成就類別")}}</option>
                            {% for category in achievement_categories %}
                                <option value="{{ category.value.0 }}">{{ category.value.1 }}</option>
                            {% endfor %}
                        </select>

                        <!-- Point -->
                        <label class="form-label">{{trans("Point")}}</label>
                        <select class="custom-select mb-3" id="point" name="point" required>
                            <option value="" disabled selected>{{trans("達成成就經驗值")}}</option>
                            {% for point in range(0,5001,50) %}
                                <option value="{{ point }}">{{ point }}</option>
                            {% endfor %}
                        </select>

                        <!-- Level -->
                        <label class="form-label">{{trans("Level")}}</label>
                        <select class="custom-select mb-3" id="level" name="level" required>
                            <option value="" disabled selected>{{trans("可接取任務之等級")}}</option>
                            {% for level in range(1,50) %}
                                <option value="{{ level }}">{{ level }}</option>
                            {% endfor %}
                        </select>

                        <!-- Completion -->
                        <label class="form-label">{{trans("Completion")}}</label>
                        <select class="custom-select mb-3" id="completion" name="completion" required>
                            <option value="" disabled selected>{{trans("完成值/次數")}}</option>
                            {% for completion in range(1,101) %}
                                <option value="{{ completion }}">{{ completion }}</option>
                            {% endfor %}
                        </select>

                        <!-- Buttons -->
                        <button type="submit" class="btn btn-primary mt-3">{{trans("Submit")}}</button>
                        <div class="d-flex justify-content-between mt-3">
                            <button type="reset" class="btn btn-outline-secondary">{{trans("Reset")}}</button>
                            <button type="button" class="btn btn-outline-danger" onclick="history.go(-1)">{{trans("Cancel")}}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
body {
    font-family: 'DFKai-SB','BiauKai','標楷體', serif;
    background: linear-gradient(135deg,  #6b8dd6);
    min-height: 100vh;
}

.achievement-create-form {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
}

.achievement-card {
    background-color: #d3f2fc;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.achievement-card .card-header {
    font-size: 1.8rem;
    font-weight: 600;
    color: #0d6efd;
    text-align: center;
    margin-bottom: 1.5rem;
}

.achievement-card .form-label {
    font-weight: 500;
    margin-top: 1rem;
}

.achievement-card .form-control, .achievement-card .custom-select, .achievement-card textarea {
    border-radius: 8px;
    margin-top: 0.3rem;
    padding: 0.5rem 0.8rem;
}

.achievement-card .btn-primary {
    width: 100%;
    border-radius: 8px;
    padding: 0.6rem;
    font-size: 1rem;
}
</style>
{% endblock %}

{% block navbarFocused %}
<script>
    navbarFocused("SystemManager_navbar");
</script>
{% endblock %}
